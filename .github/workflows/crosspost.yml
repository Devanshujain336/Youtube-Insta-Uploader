name: YouTube to Instagram Reels Auto-Publish

on:
  schedule:
    # Runs automatically every 30 minutes
    - cron: '*/30 * * * *'
  # Allows you to click "Run workflow" manually to test
  workflow_dispatch:

jobs:
  check-and-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install yt-dlp requests

      - name: Run Auto-Publisher
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python main.py

      - name: Save upload history
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add uploaded_ids.txt
          git commit -m "Update uploaded_ids.txt [skip ci]" || exit 0
          git push
