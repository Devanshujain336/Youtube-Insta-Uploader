name: YouTube to Instagram Auto-Reposter

on:
  schedule:
  - cron: '15 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-youtube-to-instagram:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repo
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🦕 Install Deno JS Runtime & PO Token Server
        run: |
          curl -fsSL https://deno.land/install.sh | sudo env DENO_INSTALL=/usr/local sh -s -- -y
          deno --version
          docker run --name bgutil-provider -d --init -p 127.0.0.1:4416:4416 brainicism/bgutil-ytdlp-pot-provider
          sleep 3

      - name: 🎬 Install FFmpeg & yt-dlp
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install -U "yt-dlp[default,curl-cffi]" bgutil-ytdlp-pot-provider pytubefix requests

      - name: 🚀 Check YouTube & Post to Instagram
        env:
          YOUTUBE_CHANNEL_URL: "https://www.youtube.com/@MathonGoCoupons/shorts"
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python yt_to_insta.py

      - name: 💾 Save Posted Video ID to Memory (posted_videos.txt)
        run: |
          if [ -f posted_videos.txt ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add posted_videos.txt
            git diff --staged --quiet || git commit -m "chore: mark YouTube video as posted to Instagram"
            git push
          fi
